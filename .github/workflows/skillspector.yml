name: SkillSpector scan

# Static security scan of every skill with NVIDIA SkillSpector.
# The gate fails unless every skill is rated SAFE and the scan is complete.
#
# SkillSpector is third-party code, so the scan job only gets a read-only token and keeps no
# git credentials on disk. Uploading SARIF and attaching reports to a release happen in
# separate jobs that run only first-party actions and the gh CLI.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly, Monday 05:17 UTC, to pick up new rules
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  SKILLSPECTOR_REF: v2.13.6
  # Commit of the tag above. Install from the commit so a moved tag cannot change what runs.
  SKILLSPECTOR_SHA: e2674da339b0bddc6e565d059c0577c6d9cd25da
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install SkillSpector ${{ env.SKILLSPECTOR_REF }}
        run: pipx install --python python3.13 "git+https://github.com/NVIDIA/skillspector.git@${SKILLSPECTOR_SHA}"
      - name: Scan (static analysis, no LLM)
        run: |
          mkdir -p reports
          set +e
          skillspector scan skills/ --recursive --no-llm --fail-on-incomplete --format json --output reports/skillspector.json
          echo "scan_exit=$?" >> "$GITHUB_ENV"
          skillspector scan skills/ --recursive --no-llm --format sarif --output reports/skillspector.sarif
          skillspector scan skills/ --recursive --no-llm --format markdown --output reports/skillspector.md
          exit 0
      - name: "Gate: every skill must be SAFE"
        run: |
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("reports/skillspector.json"))
          rows = ["| Skill | Score | Verdict | Findings |", "|---|---|---|---|"]
          bad = []
          for s in d["skills"]:
              verdict = s["risk_assessment"]["recommendation"]
              ids = ", ".join(sorted({i["id"] + " " + i["severity"].lower() for i in s["issues"]})) or "none"
              rows.append("| `%s` | %s | %s | %s |" % (s["name"], s["risk_score"], verdict, ids))
              if verdict != "SAFE":
                  bad.append(s["name"])
          done = d["analysis_completeness"]["status"]
          summary = "## SkillSpector %s\n\nMax score %s, overall %s, analysis %s.\n\n%s\n" % (
              os.environ["SKILLSPECTOR_REF"], d["max_risk_score"], d["risk_recommendation"], done, "\n".join(rows))
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(summary)
          print(summary)
          if bad or os.environ.get("scan_exit") != "0":
              sys.exit("Not SAFE: %s (scan exit %s)" % (", ".join(bad) or "-", os.environ.get("scan_exit")))
          PY
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skillspector-report
          path: reports/

  sarif:
    name: Upload SARIF to code scanning
    needs: scan
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    continue-on-error: true   # needs code scanning enabled (free for public repositories)
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: skillspector-report
          path: reports
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/skillspector.sarif
          category: skillspector

  release-assets:
    name: Attach report to the release
    needs: scan
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: skillspector-report
          path: reports
      - name: Upload report files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" reports/skillspector.json reports/skillspector.md --clobber --repo "$GITHUB_REPOSITORY"
