name: Agent evals

# Runs real coding agents with the skills on evals/fixtures/tinyshop and checks what they wrote.
# Each agent runs only when its secret is set:
#   GitHub Copilot CLI  COPILOT_GITHUB_TOKEN  fine-grained personal access token with the
#                                             "Copilot Requests" permission (works with Copilot
#                                             Free, Student, Pro and Business plans)
#   Claude Code         ANTHROPIC_API_KEY
# Agent runs cost credits, so this workflow runs weekly, on demand, and when skills or evals change.
# On pull_request and push, select-cases runs first and picks only changed skill cases (or a 3-case
# smoke set when runner/fixtures/installer/workflow/selector changes). Weekly schedule and empty
# workflow_dispatch still run all 23 cases. A CASES key with no skills/aiwerk-<case>/ tree is
# included only from those full runs or an explicit dispatch list.
#
# The agent gets a filtered environment and narrow tool rules (see evals/run_evals.py). Only the
# structured summary files (results.json and summary.md) are staged and uploaded, and only after
# symlink and key checks pass. Artifacts are kept for 7 days.

on:
  push:
    branches: [main]
    paths: ["skills/**", "evals/**", "install.sh", ".github/workflows/evals.yml"]
  pull_request:
    paths: ["skills/**", "evals/**", "install.sh", ".github/workflows/evals.yml"]
  schedule:
    - cron: "41 4 * * 3"   # weekly, Wednesday 04:41 UTC
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated cases (empty = all)"
        default: ""
      model:
        description: "Model (empty = default; Copilot Student plans support auto only)"
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COPILOT_CLI_VERSION: "1.0.105"
  CLAUDE_CODE_VERSION: "2.1.328"
  PYTEST_VERSION: "8.3.5"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  select-cases:
    name: Select eval cases
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      cases: ${{ steps.select.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EXPLICIT_CASES: ${{ inputs.cases }}
        run: |
          set -e
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          args=(--event "$EVENT" --explicit-cases "$EXPLICIT_CASES" --default-branch "$DEFAULT_BRANCH")
          case "$EVENT" in
            pull_request)
              args+=(--base-sha "$BASE_SHA" --head-sha "$HEAD_SHA")
              ;;
            push)
              args+=(--before-sha "$BEFORE_SHA" --after-sha "$AFTER_SHA")
              ;;
          esac
          python3 evals/select_eval_cases.py "${args[@]}"

  secrets:
    name: Which agents can run
    needs: select-cases
    if: needs.select-cases.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      copilot: ${{ steps.check.outputs.copilot }}
      claude: ${{ steps.check.outputs.claude }}
    steps:
      - id: check
        env:
          HAS_COPILOT: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
          HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "copilot=$HAS_COPILOT" >> "$GITHUB_OUTPUT"
          echo "claude=$HAS_CLAUDE" >> "$GITHUB_OUTPUT"
          {
            echo "## Agent evals"
            echo "- GitHub Copilot CLI: $([ "$HAS_COPILOT" = true ] && echo runs || echo 'skipped, no COPILOT_GITHUB_TOKEN secret')"
            echo "- Claude Code: $([ "$HAS_CLAUDE" = true ] && echo runs || echo 'skipped, no ANTHROPIC_API_KEY secret')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_COPILOT" != true ] && [ "$HAS_CLAUDE" != true ]; then
            msg="No agent secret is set, so no evals ran."
            # Pull requests from forks never get secrets: skip quietly. Everywhere else, fail
            # so the badge never shows green for evals that did not run.
            if [ "$EVENT" = "pull_request" ]; then echo "::notice::$msg"; exit 0; fi
            echo "::error::$msg Add COPILOT_GITHUB_TOKEN or ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

  copilot:
    name: GitHub Copilot CLI
    needs: [select-cases, secrets]
    if: needs.select-cases.outputs.run == 'true' && needs.secrets.outputs.copilot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install Copilot CLI ${{ env.COPILOT_CLI_VERSION }}
        run: npm install -g "@github/copilot@${COPILOT_CLI_VERSION}"
      - name: Install pytest ${{ env.PYTEST_VERSION }} for fixture tests
        run: pip install "pytest==${PYTEST_VERSION}"
      - name: Run evals
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CASES: ${{ needs.select-cases.outputs.cases }}
          MODEL: ${{ inputs.model }}
        run: |
          args=(--harness copilot --cases "$CASES")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          env -u GITHUB_STEP_SUMMARY python3 evals/run_evals.py "${args[@]}"
      - name: Check and stage results
        id: leak
        if: ${{ !cancelled() }}
        env:
          KEY: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          STAGE: ${{ runner.temp }}/eval-upload
        run: |
          # grep exits 0 on a match, 1 on no match and 2 on an error. Only 1 is safe to upload.
          fail() { echo "::error::$1 Results are not uploaded."; exit 1; }
          [ -n "$KEY" ] || fail "Missing key for leak check."
          [ -d evals/results ] && [ ! -L evals/results ] || fail "No regular results folder."
          symlinks=$(find evals/results -type l -print -quit)
          [ -z "$symlinks" ] || fail "Symbolic links found in results."
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for name in results.json summary.md; do
            src="evals/results/$name"
            [ -f "$src" ] && [ ! -L "$src" ] || fail "Missing regular file: $name."
            cp -P -- "$src" "$STAGE/$name"
          done
          set +e
          grep -rqF -- "$KEY" "$STAGE"; exact=$?
          grep -rqE -- 'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|sk-ant-[A-Za-z0-9_-]{20,}' "$STAGE"; shaped=$?
          set -e
          [ "$exact" -eq 1 ] || fail "The COPILOT_GITHUB_TOKEN key, or a read error, was found in the results."
          [ "$shaped" -eq 1 ] || fail "A token-shaped string, or a read error, was found in the results."
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$STAGE/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload results
        if: ${{ !cancelled() && steps.leak.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-results-copilot
          path: ${{ runner.temp }}/eval-upload/
          retention-days: 7

  claude-code:
    name: Claude Code
    needs: [select-cases, secrets]
    if: needs.select-cases.outputs.run == 'true' && needs.secrets.outputs.claude == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code ${{ env.CLAUDE_CODE_VERSION }}
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Install pytest ${{ env.PYTEST_VERSION }} for fixture tests
        run: pip install "pytest==${PYTEST_VERSION}"
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASES: ${{ needs.select-cases.outputs.cases }}
          MODEL: ${{ inputs.model }}
        run: |
          args=(--harness claude --cases "$CASES")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          env -u GITHUB_STEP_SUMMARY python3 evals/run_evals.py "${args[@]}"
      - name: Check and stage results
        id: leak
        if: ${{ !cancelled() }}
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STAGE: ${{ runner.temp }}/eval-upload
        run: |
          # grep exits 0 on a match, 1 on no match and 2 on an error. Only 1 is safe to upload.
          fail() { echo "::error::$1 Results are not uploaded."; exit 1; }
          [ -n "$KEY" ] || fail "Missing key for leak check."
          [ -d evals/results ] && [ ! -L evals/results ] || fail "No regular results folder."
          symlinks=$(find evals/results -type l -print -quit)
          [ -z "$symlinks" ] || fail "Symbolic links found in results."
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for name in results.json summary.md; do
            src="evals/results/$name"
            [ -f "$src" ] && [ ! -L "$src" ] || fail "Missing regular file: $name."
            cp -P -- "$src" "$STAGE/$name"
          done
          set +e
          grep -rqF -- "$KEY" "$STAGE"; exact=$?
          grep -rqE -- 'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|sk-ant-[A-Za-z0-9_-]{20,}' "$STAGE"; shaped=$?
          set -e
          [ "$exact" -eq 1 ] || fail "The ANTHROPIC_API_KEY key, or a read error, was found in the results."
          [ "$shaped" -eq 1 ] || fail "A token-shaped string, or a read error, was found in the results."
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$STAGE/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload results
        if: ${{ !cancelled() && steps.leak.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-results-claude-code
          path: ${{ runner.temp }}/eval-upload/
          retention-days: 7
