name: AI Werk PR governance gates

# Example workflow: on a same-repository pull request, run stage 03 eval and governance
# skills (aiwerk-review, aiwerk-test-gate, aiwerk-security-gate, aiwerk-policy) headless
# with GitHub Copilot CLI (copilot -p) or Claude Code (claude -p).
# Copy this file to .github/workflows/ in your project and pin AIWERK_REF to a release tag.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      spec_id:
        description: "Spec ID under .aiwerk/brain/specs/ (for example GH-12)"
        required: true
        type: string
      base_ref:
        description: "Base branch to diff against"
        default: "main"
        type: string

permissions:
  contents: read

env:
  AIWERK_REF: "v0.4.0"
  COPILOT_CLI_VERSION: "1.0.105"
  CLAUDE_CODE_VERSION: "2.1.328"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  copilot:
    name: Stage 03 gates (Copilot CLI)
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      secrets.COPILOT_GITHUB_TOKEN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: AnPod/softwarefactory
          ref: ${{ env.AIWERK_REF }}
          path: .aiwerk-skills-src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install AI Werk Skills
        run: .aiwerk-skills-src/install.sh --project "$PWD" --harness agents --apply
      - name: Install Copilot CLI ${{ env.COPILOT_CLI_VERSION }}
        run: npm install -g "@github/copilot@${COPILOT_CLI_VERSION}"
      - name: Run stage 03 skills with copilot -p
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SPEC_ID: ${{ inputs.spec_id || format('PR-{0}', github.event.pull_request.number) }}
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref || 'main' }}
        run: |
          PROMPT="For ${SPEC_ID}, run aiwerk-review, aiwerk-test-gate, aiwerk-security-gate and aiwerk-policy against origin/${BASE_REF}. Non-interactive mode: do not ask me any questions, use detected values and defaults, and record your assumptions."
          copilot --no-auto-update -p "$PROMPT" --silent --no-ask-user --no-color \
            --disable-builtin-mcps --model auto \
            --secret-env-vars=COPILOT_GITHUB_TOKEN,GH_TOKEN,GITHUB_TOKEN,ANTHROPIC_API_KEY \
            --allow-tool=write \
            "--allow-tool=shell(git:*)" \
            "--allow-tool=shell(ls:*)" \
            "--allow-tool=shell(python3:*)" \
            "--allow-tool=shell(command:*)" \
            "--allow-tool=shell(mkdir:*)" \
            "--allow-tool=shell(cp:*)" \
            "--allow-tool=shell(date:*)" \
            "--allow-tool=shell(cat:*)" \
            "--allow-tool=shell(find:*)" \
            "--allow-tool=shell(wc:*)" \
            "--allow-tool=shell(head:*)" \
            "--allow-tool=shell(pytest:*)" \
            "--allow-tool=shell(make test)" \
            "--allow-tool=shell(make lint)" \
            "--deny-tool=shell(git push)" \
            "--deny-tool=shell(git remote)" \
            "--deny-tool=shell(curl)" \
            "--deny-tool=shell(wget)"
      - name: Validate brain output
        run: python3 .agents/skills/aiwerk-refresh/scripts/brain_status.py .aiwerk/brain --strict
      - name: Publish gate summary
        env:
          SPEC_ID: ${{ inputs.spec_id || format('PR-{0}', github.event.pull_request.number) }}
        run: |
          {
            echo "## AI Werk stage 03 gates (${SPEC_ID}, Copilot CLI)"
            for f in review tests security policy; do
              p=".aiwerk/brain/specs/${SPEC_ID}/${f}.md"
              if [ -f "$p" ]; then
                verdict="$(grep -i 'verdict' "$p" | head -n 1 || true)"
                echo "- **${f}:** ${verdict:-written}"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aiwerk-gates-copilot-${{ inputs.spec_id || format('PR-{0}', github.event.pull_request.number) }}
          path: .aiwerk/brain/specs/${{ inputs.spec_id || format('PR-{0}', github.event.pull_request.number) }}/

  claude-code:
    name: Stage 03 gates (Claude Code)
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      secrets.ANTHROPIC_API_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: AnPod/softwarefactory
          ref: ${{ env.AIWERK_REF }}
          path: .aiwerk-skills-src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install AI Werk Skills
        run: .aiwerk-skills-src/install.sh --project "$PWD" --harness claude --apply
      - name: Install Claude Code ${{ env.CLAUDE_CODE_VERSION }}
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Run stage 03 skills with claude -p
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPEC_ID: ${{ inputs.spec_id || format('PR-{0}', github.event.pull_request.number) }}
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref || 'main' }}
        run: |
          PROMPT="For ${SPEC_ID}, run aiwerk-review, aiwerk-test-gate, aiwerk-security-gate and aiwerk-policy against origin/${BASE_REF}. Non-interactive mode: do not ask me any questions, use detected values and defaults, and record your assumptions."
          printf '%s' "$PROMPT" | claude -p --output-format text --permission-mode acceptEdits \
            --allowedTools \
            Read Write Edit Glob Grep Skill \
            "Bash(git:*)" "Bash(ls:*)" "Bash(python3:*)" "Bash(command -v:*)" "Bash(mkdir:*)" \
            "Bash(cp:*)" "Bash(date:*)" "Bash(cat:*)" "Bash(find:*)" "Bash(wc:*)" "Bash(head:*)" \
            "Bash(pytest:*)" "Bash(make test)" "Bash(make lint)"
      - name: Validate brain output
        run: python3 .claude/skills/aiwerk-refresh/scripts/brain_status.py .aiwerk/brain --strict
      - name: Publish gate summary
        env:
          SPEC_ID: ${{ inputs.spec_id || format('PR-{0}', github.event.pull_request.number) }}
        run: |
          {
            echo "## AI Werk stage 03 gates (${SPEC_ID}, Claude Code)"
            for f in review tests security policy; do
              p=".aiwerk/brain/specs/${SPEC_ID}/${f}.md"
              if [ -f "$p" ]; then
                verdict="$(grep -i 'verdict' "$p" | head -n 1 || true)"
                echo "- **${f}:** ${verdict:-written}"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aiwerk-gates-claude-${{ inputs.spec_id || format('PR-{0}', github.event.pull_request.number) }}
          path: .aiwerk/brain/specs/${{ inputs.spec_id || format('PR-{0}', github.event.pull_request.number) }}/
