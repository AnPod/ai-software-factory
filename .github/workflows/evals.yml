name: Agent evals

# Runs Claude Code with the skills on evals/fixtures/tinyshop and checks what it wrote.
# Needs the repository secret ANTHROPIC_API_KEY. Costs API usage, so it runs weekly,
# on demand, and when skills or evals change.

on:
  push:
    branches: [main]
    paths: ["skills/**", "evals/**", "install.sh", ".github/workflows/evals.yml"]
  pull_request:
    paths: ["skills/**", "evals/**", "install.sh", ".github/workflows/evals.yml"]
  schedule:
    - cron: "41 4 * * 3"   # weekly, Wednesday 04:41 UTC
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated cases (init, landscape, survey, refresh)"
        default: "init,landscape,survey,refresh"
      model:
        description: "Model for Claude Code (empty = CLI default)"
        default: ""

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.328"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          msg="ANTHROPIC_API_KEY secret is not set, evals did not run."
          echo "## Agent evals skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          # Pull requests from forks never get secrets: skip quietly. Everywhere else, fail loudly
          # so the badge never shows green for evals that did not run.
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "::notice::$msg"; exit 0; fi
          echo "::error::$msg Add it under Settings > Secrets and variables > Actions."; exit 1
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Install Claude Code ${{ env.CLAUDE_CODE_VERSION }}
        if: steps.key.outputs.present == 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Run evals
        if: steps.key.outputs.present == 'true'
        env:
          CASES: ${{ inputs.cases || 'init,landscape,survey,refresh' }}
          MODEL: ${{ inputs.model }}
        run: |
          args=(--cases "$CASES")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          python3 evals/run_evals.py "${args[@]}"
      - name: Upload results and transcripts
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
